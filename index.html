<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>Index</title>
    <style>
      body { font-family: Arial, sans-serif; padding: 1rem; }
      nav { margin-bottom: 1rem; }
      .breadcrumb { margin-bottom: 0.5rem; font-size: 0.9rem; color: #333; }
      ul { list-style: none; padding-left: 0; }
      li { margin: 0.25rem 0; }
      a.dir { font-weight: bold; cursor: pointer; color: #0366d6; text-decoration: none; }
      a.dir:hover { text-decoration: underline; }
      a.file { color: #000; text-decoration: none; }
      a.file:hover { text-decoration: underline; }
    </style>
  </head>
  <body>
    <h2>Files</h2>
    <nav id="nav"></nav>
    <div id="list">Loading…</div>

    <script>
      (async () => {
        const repoApi = 'https://api.github.com/repos/harry0412xd/harry0412xd.github.io/contents';
        // start from hash if present so links are shareable
        let currentPath = decodeURIComponent(location.hash.replace(/^#/, '')) || '';

        async function listDir(path) {
          const url = path ? `${repoApi}/${encodeURIComponent(path)}` : repoApi;
          const res = await fetch(url);
          if (!res.ok) throw new Error(`GitHub API ${res.status} ${res.statusText}`);
          return res.json();
        }

        function renderBreadcrumb(path) {
          const nav = document.getElementById('nav');
          const parts = path ? path.split('/') : [];
          const crumbs = ['<span class="breadcrumb">'];
          crumbs.push(`<a href="#" data-path="" class="dir">root</a>`);
          let acc = '';
          parts.forEach((p, i) => {
            acc = acc ? `${acc}/${p}` : p;
            crumbs.push(' / ');
            crumbs.push(`<a href="#" data-path="${acc}" class="dir">${p}</a>`);
          });
          crumbs.push('</span>');
          // back-to-parent link (only if not root)
          if (parts.length) {
            crumbs.unshift(`<a href="#" data-action="up" style="margin-right:1rem;">← Back</a>`);
          }
          nav.innerHTML = crumbs.join('');
        }

        async function render() {
          try {
            renderBreadcrumb(currentPath);
            const items = await listDir(currentPath);
            const list = [];
            // show directories first
            const dirs = items.filter(i => i.type === 'dir').sort((a,b)=>a.name.localeCompare(b.name));
            const files = items.filter(i => i.type === 'file').sort((a,b)=>a.name.localeCompare(b.name));
            for (const d of dirs) {
              // show directory entries; clicking drills down
              list.push(`<li><a href="#" class="dir" data-type="dir" data-path="${d.path}">📁 ${d.name}</a></li>`);
            }
            for (const f of files) {
              // ignore files that start with '_' and only keep .html files
              if (f.name.startsWith('_')) continue;
              if (!f.name.toLowerCase().endsWith('.html')) continue;
              // link to the repository-relative path (adjust if you want raw/deployed link)
              list.push(`<li><a href="${f.path}" class="file">📄 ${f.name}</a></li>`);
            }
            const html = list.length ? `<ul>${list.join('')}</ul>` : '<p>No html files found in this folder.</p>';
            document.getElementById('list').innerHTML = html;
            // update location.hash for shareable links
            location.replace(`#${encodeURIComponent(currentPath)}`);
          } catch (err) {
            document.getElementById('list').innerHTML = `<p>Error: ${err.message}</p>`;
          }
        }

        // handle clicks for directory navigation and back
        document.body.addEventListener('click', (e) => {
          const el = e.target.closest('a');
          if (!el) return;
          // back to parent action
          if (el.dataset.action === 'up') {
            e.preventDefault();
            if (!currentPath) return;
            const parts = currentPath.split('/');
            parts.pop();
            currentPath = parts.join('/');
            render();
            return;
          }
          // direct breadcrumb or dir click
          if (el.dataset.type === 'dir' || el.dataset.path !== undefined) {
            const targetPath = el.dataset.path || '';
            if (targetPath !== undefined) {
              e.preventDefault();
              currentPath = targetPath;
              render();
            }
            return;
          }
          // file links will navigate normally
        });

        // initial render
        await render();
      })();
    </script>
  </body>
</html>

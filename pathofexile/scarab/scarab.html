<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>PoE Scarab Prices</title>
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700&display=swap" rel="stylesheet">
    <style>
        body { 
            font-family: 'Orbitron', monospace; 
            background: linear-gradient(135deg, #1a1a2e, #16213e); 
            color: #e0e0e0; 
            margin: 0; 
            padding: 20px; 
        }
        h1 { 
            text-align: center; 
            color: #ffd700; 
            text-shadow: 0 0 10px #ffd700; 
            margin-bottom: 20px; 
        }
        #groups { 
            display: flex; 
            flex-wrap: wrap; 
            gap: 15px; 
        }
        .group { 
            flex: 1; 
            min-width: 280px; 
            background: rgba(255, 255, 255, 0.1); 
            border: 1px solid rgba(255, 215, 0, 0.3); 
            border-radius: 10px; 
            padding: 15px; 
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.5); 
            backdrop-filter: blur(10px); 
        }
        h3 { 
            margin: 0 0 10px 0; 
            color: #ffd700; 
            font-size: 14px; 
            text-align: center; 
            border-bottom: 1px solid rgba(255, 215, 0, 0.3); 
            padding-bottom: 5px; 
        }
        table { 
            border-collapse: collapse; 
            width: 100%; 
            margin-bottom: 5px; 
        }
        th, td { 
            border: 1px solid rgba(255, 255, 255, 0.2); 
            padding: 4px; 
            text-align: left; 
            font-size: 11px; 
        }
        th { 
            background: rgba(255, 215, 0, 0.2); 
            color: #ffd700; 
        }
        tr:nth-child(even) { background: rgba(255, 255, 255, 0.05); }
    </style>
</head>
<body>
    <div id="content">Loading...</div>
    <script>
        async function loadScarabData() {
            const league = 'Keepers';
            const originalUrl = `https://poe.ninja/poe1/api/economy/exchange/current/overview?league=${encodeURIComponent(league)}&type=Scarab`;
            const proxyUrl = `https://api.allorigins.win/raw?url=${encodeURIComponent(originalUrl)}`;
            try {
                const res = await fetch(proxyUrl);
                const data = await res.json();
                const lines = data.lines.filter(l => l.primaryValue > 0);
                const itemsMap = new Map();
                data.items.forEach(item => itemsMap.set(item.id, item.name));
                const scarabs = lines.map(l => {
                    const name = itemsMap.get(l.id);
                    return name && name.includes('Scarab') ? { name, chaosValue: l.primaryValue } : null;
                }).filter(Boolean);
                const tierOrder = { 'Basic': 0, 'Rusted': 1, 'Polished': 2, 'Gilded': 3, 'Advanced': 4, 'Winged': 4, 'Horned': 5, 'Bountiful': 6, 'Fracturing': 7 };
                const groups = {};
                scarabs.forEach(s => {
                    const parts = s.name.split(' ');
                    let tier = 'Unknown';
                    let mechanic = 'Unknown';
                    let tierLevel = 999;
                    const scarabIdx = parts.indexOf('Scarab');
                    if (scarabIdx !== -1) {
                        const before = parts.slice(0, scarabIdx);
                        const after = parts.slice(scarabIdx + 1);
                        if (before.length > 0) {
                            if (before[0] === 'Rusted') { tier = 'Rusted'; mechanic = before[1]; tierLevel = 1; }
                            else if (before[0] === 'Polished') { tier = 'Polished'; mechanic = before[1]; tierLevel = 2; }
                            else if (before[0] === 'Gilded') { tier = 'Gilded'; mechanic = before[1]; tierLevel = 3; }
                            else if (before[0] === 'Winged') { tier = 'Winged'; mechanic = before[1]; tierLevel = 4; }
                            else if (before[0] === 'Advanced') { tier = 'Advanced'; mechanic = before[1]; tierLevel = 4; }
                            else if (before[0] === 'Bountiful') { tier = 'Bountiful'; mechanic = before[1]; tierLevel = 6; }
                            else if (before[0] === 'Fracturing') { tier = 'Fracturing'; mechanic = before[1]; tierLevel = 7; }
                            else if (before[0] === 'Horned' && after[0] === 'of') { tier = 'Horned'; mechanic = 'Horned Scarabs'; tierLevel = 5; }
                            else if (before.length === 1) { tier = 'Basic'; mechanic = before[0]; tierLevel = 0; }
                        }
                    }
                    if (mechanic !== 'Unknown' && tier !== 'Unknown') {
                        if (!groups[mechanic]) groups[mechanic] = [];
                        groups[mechanic].push({ ...s, tier, tierLevel: tierOrder[tier] || tierLevel });
                    }
                });
                Object.keys(groups).forEach(m => {
                    groups[m].sort((a, b) => a.tierLevel - b.tierLevel);
                });
                const groupList = Object.entries(groups).map(([m, items]) => {
                    const avg = items.reduce((sum, i) => sum + i.chaosValue, 0) / items.length;
                    return { mechanic: m, items, avg };
                }).sort((a, b) => b.avg - a.avg);
                let html = '<h1>Scarab Prices Grouped by Mechanic (Ranked by Avg Price)</h1><div id="groups">';
                groupList.forEach((g, idx) => {
                    html += `<div class="group"><h3>Rank ${idx + 1}: ${g.mechanic} (Avg: ${g.avg.toFixed(1)}c)</h3>`;
                    html += '<table><tr><th>Name</th><th>Price</th></tr>';
                    g.items.forEach(i => {
                        html += `<tr><td>${i.name}</td><td>${i.chaosValue.toFixed(1)}c</td></tr>`;
                    });
                    html += '</table></div>';
                });
                html += '</div>';
                document.getElementById('content').innerHTML = html;
            } catch (e) {
                document.getElementById('content').innerHTML = 'Error loading data.';
            }
        }
        loadScarabData();
    </script>
</body>
</html>
